<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UFO Tracker | Global Monitoring</title>
  
  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UFO Tracker">
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="manifest.json">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
  
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg-primary: #050505;
      --bg-secondary: #0a0a0c;
      --text-primary: #22c55e;
      --text-secondary: #16a34a;
      --border-color: rgba(34, 197, 94, 0.2);
      --card-bg: rgba(10, 10, 12, 0.9);
    }

    .light {
      --bg-primary: #f1f5f9;
      --bg-secondary: #ffffff;
      --text-primary: #166534;
      --text-secondary: #15803d;
      --border-color: rgba(22, 101, 52, 0.1);
      --card-bg: rgba(255, 255, 255, 0.95);
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    #root { height: 100%; width: 100%; position: relative; }
    
    .leaflet-container { background: var(--bg-primary) !important; border: 0 !important; }
    
    .leaflet-control-zoom {
      margin-bottom: 100px !important;
    }

    @media (min-width: 768px) {
      .leaflet-control-zoom { margin-bottom: 20px !important; }
    }

    .leaflet-control-zoom-in, .leaflet-control-zoom-out {
      background: var(--bg-secondary) !important;
      color: var(--text-primary) !important;
      border: 1px solid var(--border-color) !important;
    }

    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--text-primary); }

    /* Custom scanline animation for auth */
    @keyframes scan {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }
    .scan-line {
      animation: scan 4s linear infinite;
    }
  </style>

  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "leaflet": "https://esm.sh/leaflet@1.9.4"
  }
}
</script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react,typescript" data-type="module" src="index.tsx"></script>
</body>
</html>
